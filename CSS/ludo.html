<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .ludo-board {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            background-color: #ffffff;
            border: 4px solid #000000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

  
        .box {
            border: 1px solid #b2bec3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .red { background-color: #e74c3c; }
        .green { background-color: #2ecc71; }
        .blue { background-color: #3498db; }
        .yellow { background-color: #f1c40f; }
        .white { background-color: #ffffff; }
        .safe { background-color: #f5f6fa; }

 
        .base-red {
            grid-column: 1 / 7;
            grid-row: 1 / 7;
            background-color: #e74c3c;
            padding: 24px;
            border: 3px solid #000000;
        }

        .base-green {
            grid-column: 10 / 16;
            grid-row: 1 / 7;
            background-color: #2ecc71;
            padding: 24px;
            border: 3px solid #000000;
        }

        .base-blue {
            grid-column: 1 / 7;
            grid-row: 10 / 16;
            background-color: #3498db;
            padding: 24px;
            border: 3px solid #000000;
        }

        .base-yellow {
            grid-column: 10 / 16;
            grid-row: 10 / 16;
            background-color: #f1c40f;
            padding: 24px;
            border: 3px solid #000000;
        }


        .base-inner {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 14px;
            gap: 14px;
            border-radius: 4px;
        }

   
        .token-circle {
            border-radius: 50%;
            width: 100%;
            height: 100%;
            border: 3px solid;
        }

        .base-red .token-circle { border-color: #e74c3c; background-color: #e74c3c; }
        .base-green .token-circle { border-color: #2ecc71; background-color: #2ecc71; }
        .base-blue .token-circle { border-color: #3498db; background-color: #3498db; }
        .base-yellow .token-circle { border-color: #f1c40f; background-color: #f1c40f; }

     
        .center-home {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            background: conic-gradient(
                #e74c3c 0deg 90deg,
                #2ecc71 90deg 180deg,
                #f1c40f 180deg 270deg,
                #3498db 270deg 360deg
            );
            border: 2px solid #000000;
        }
    </style>
</head>
<body>

    <div class="ludo-board">
  
        <div class="base-red">
            <div class="base-inner">
                <div class="token-circle"></div><div class="token-circle"></div>
                <div class="token-circle"></div><div class="token-circle"></div>
            </div>
        </div>

        <div class="base-green">
            <div class="base-inner">
                <div class="token-circle"></div><div class="token-circle"></div>
                <div class="token-circle"></div><div class="token-circle"></div>

        <div class="base-blue">

        <div class="center-home"></div>
